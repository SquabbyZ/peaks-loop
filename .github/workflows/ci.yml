name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: vitest + build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # node 20.x removed 2026-09-08: its pnpm install step failed on
        # windows-latest and could not be diagnosed (job logs are
        # admin-only). publish.yml targets node 22.x; 20.x is near EOL.
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # pnpm/action-setup@v4 + @v6 both fail the self-installer on the
        # runner's default Node 24 (this step runs before setup-node pins
        # the matrix node). corepack is bundled with Node and needs no
        # external self-installer; pin pnpm to match packageManager.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Canonical typecheck happens inside `npm run build`: it builds every
        # workspace package (creating packages/*/dist, which the shared
        # `./version` subpath export resolves to) then runs
        # `tsc -p tsconfig.build.json`. A standalone pre-Build `tsc` step
        # cannot resolve `peaks-loop-shared/version` on a fresh checkout
        # (dist absent) and is therefore always red — removed (same contract
        # as publish.yml).
        run: npm run build

      - name: Test
        # github-actions reporter surfaces each failure as a GitHub
        # annotation, which is readable without repo-admin rights — the
        # job log itself is admin-only on this repo.
        run: npx vitest run --reporter=default --reporter=github-actions
        env:
          # Suppress per-platform timing flake; tests stub Date where needed.
          TZ: UTC

      - name: Run capability guards
        # The J02/J* contracts spawn `bin/peaks.js`, whose caller-id
        # resolution falls through to D2/EX_USAGE (exit 64) on a CI runner
        # with no IDE adapter env. PEAKS_CALLER_ID is the documented
        # vendor-neutral override for exactly this case
        # (src/services/session/resolve-caller-id.ts L16-20).
        run: pnpm test:capability-guard
        env:
          PEAKS_CALLER_ID: ci-runner

  binding-store-multi-process:
    # Slice v2.18.0 REDO — two-Claude-windows CI integration test.
    # Exercises the binding-store P0 fix across 2 truly distinct child
    # Node processes; gated to ubuntu-latest because Windows / macOS
    # ACL / job-object semantics add non-determinism to the pid-suffix
    # surface. Adding this as a separate job keeps the main matrix
    # small (windows-latest x 2 node versions x 2 OSes = 4 cells).
    name: binding-store multi-process integration (ubuntu-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # pnpm/action-setup@v4 + @v6 both fail the self-installer on the
        # runner's default Node 24 (this step runs before setup-node pins
        # the matrix node). corepack is bundled with Node and needs no
        # external self-installer; pin pnpm to match packageManager.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Canonical typecheck happens inside `npm run build`: it builds every
        # workspace package (creating packages/*/dist, which the shared
        # `./version` subpath export resolves to) then runs
        # `tsc -p tsconfig.build.json`. A standalone pre-Build `tsc` step
        # cannot resolve `peaks-loop-shared/version` on a fresh checkout
        # (dist absent) and is therefore always red — removed (same contract
        # as publish.yml).
        run: npm run build

      - name: Test binding-store multi-process
        # The driver at scripts/fixtures/ci-binding-driver.mjs imports
        # the built dist/src/services/session/binding-store.js; the
        # `npm run build` step above populates `dist/`.
        run: PEAKS_FORCE_INTEGRATION=1 npx vitest run tests/integration/binding-store/multi-process.test.ts --reporter=default
        env:
          TZ: UTC
          CI: 'true'
          RUNNER_OS: Linux

  # Slice 2026-09-12 `integration-ci-and-windowshide`.
  #
  # Until now the FULL `tests/integration` suite (90 files / ~462 tests) ran
  # NOWHERE. The `test` job above runs the DEFAULT vitest config, whose
  # `include` is `tests/unit/**` and which EXCLUDES `tests/integration/**`;
  # the `binding-store-multi-process` job above covers exactly one file.
  # So "CI green" never covered this suite, and neither did any other signal.
  #
  # THIS JOB IS EXPECTED TO FAIL AT FIRST, AND THAT IS INTENTIONAL.
  # It is wired in BEFORE the 20 known failures are fixed. There is
  # deliberately NO `continue-on-error`, NO `|| true`, NO skipped tests and
  # NO relaxed assertions — a red workflow is the honest initial state, and
  # suppressing it would recreate the exact "looks green, checked nothing"
  # shape this job exists to end. Triage of the 20 failures lives in
  # `.peaks/_runtime/2026-09-12-session-e37ef0/qa/integration-triage.md`.
  integration-suite:
    name: 'integration suite (tests/integration, ubuntu-only, EXPECTED RED)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # Same reason as the jobs above: pnpm/action-setup's self-installer
        # fails on the runner's default Node 24.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Same contract as every other job here: `npm run build` creates
        # packages/*/dist (which the shared `./version` subpath export
        # resolves to) and runs the canonical typecheck. Parts of the
        # integration suite spawn `bin/peaks.js`, which needs `dist/`.
        run: npm run build

      - name: Test integration suite
        # Platform choice — ubuntu-latest ONLY, on purpose:
        #   * the suite runs with `fileParallelism: false` (serial, 60s
        #     timeouts) over ~460 tests, so a second OS roughly doubles
        #     wall-clock for a signal we already know is red;
        #   * the red we are wiring in is a LOWER BOUND, not an equivalent,
        #     on Windows: two integration files are Windows-aware
        #     (release-precheck, vm-kvm-runtime) and part of the known red is
        #     environment-shaped (`spawn claude ENOENT`). Wiring
        #     windows-latest is deferred to the slice that fixes the 20
        #     failures, when the signal is stable enough to be worth two
        #     platforms rather than a guess about which red is which.
        # `--config vitest.config.integration.ts` must be explicit: the
        # `test:integration` npm script omits it, so it inherits the base
        # config's `include` and selects zero files — pre-existing bug, left
        # alone by this slice.
        run: pnpm exec vitest run --config vitest.config.integration.ts tests/integration --reporter=default --reporter=github-actions
        env:
          TZ: UTC
