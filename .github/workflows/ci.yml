name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: vitest + build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest added 2026-09-15 (S6, user-decided): macOS was in NO
        # workflow at all, so every macOS-only defect class (the ESM
        # `require` fake-green in `findTranscriptJsonl`, the absent
        # CLAUDE_CONTEXT_USAGE_PERCENT, the four-way auto-compact stack)
        # was invisible to CI by construction. This matrix is the only
        # place a Mac signal can come from.
        #
        # NOT `continue-on-error`, NOT an allow-list of "known Mac
        # failures": a red macOS cell is a finding about the product. If it
        # goes red, triage it as a regression — do not suppress it, and do
        # not narrow the matrix back without saying so in the commit.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # node 20.x removed 2026-09-08: its pnpm install step failed on
        # windows-latest and could not be diagnosed (job logs are
        # admin-only). publish.yml targets node 22.x; 20.x is near EOL.
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
        # rid 2026-10-04-backlog-2-55 (owner-decided): this job runs the unit
        # suite, and two of its files (tests/unit/lint/baseline-split-anchor.test.ts,
        # baseline-split-equivalence.test.ts) pin PRE_SPLIT_ANCHOR_SHA='77b711ff'
        # and resolve it with `git show`. @v4 defaults to fetch-depth: 1, so the
        # anchor blob was absent on every CI run and 10 arms failed there while
        # passing in every full clone that measured them. The `commit-message
        # red line` job below documents this very constraint in its own comment
        # ("defaults to fetch-depth: 1, so in the `test` job …") — the
        # history-dependent legs had been landed in the job that has no history.
        # Fix = give this job the history its tests already require, not make the
        # arms degrade to a skip where they cannot resolve.
        with:
          fetch-depth: 0

      - name: Setup pnpm (corepack)
        # pnpm/action-setup@v4 + @v6 both fail the self-installer on the
        # runner's default Node 24 (this step runs before setup-node pins
        # the matrix node). corepack is bundled with Node and needs no
        # external self-installer; pin pnpm to match packageManager.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Canonical typecheck happens inside `npm run build`: it builds every
        # workspace package (creating packages/*/dist, which the shared
        # `./version` subpath export resolves to) then runs
        # `tsc -p tsconfig.build.json`. A standalone pre-Build `tsc` step
        # cannot resolve `peaks-loop-shared/version` on a fresh checkout
        # (dist absent) and is therefore always red — removed (same contract
        # as publish.yml).
        run: npm run build

      - name: Generated distribution manifest is a render, not a hand edit
        # Slice ③ (rid-037, AC-1). `npm run build` regenerates
        # `.claude-plugin/marketplace.json` from `package.json` + the skills
        # tree, so the working tree now holds a FRESH render and the index still
        # holds the COMMITTED one. A non-empty diff therefore means the committed
        # artifact was not a render — i.e. somebody hand-edited it — which is the
        # property AC-1 asks CI to assert.
        #
        # WHY THIS STEP AND NOT ONLY THE UNIT TEST. The unit test in
        # `tests/unit/services/distribution/plugin-manifest.test.ts` makes the
        # same comparison, but the job's `Build` step has already written the
        # fresh render over the working copy before `Test` runs — so in CI that
        # file compares a render against itself and cannot fail. The two are
        # deliberately different mechanisms (spec §4: the schema is introspected
        # at runtime while the artifacts are generated at build time), and this
        # step is the one that is not vacuous on a runner.
        #
        # The same gap exists for `contracts/readonly-argv-whitelist.json` (also
        # regenerated by `npm run build`, asserted only by its unit test). Adding
        # it here is one more path in the same diff and is left to its owner
        # rather than widened into this step.
        run: git diff --exit-code -- .claude-plugin/marketplace.json

      - name: Silent-warning ratchet (catch swallows)
        # Slice a3 (2026-09-29). `scripts/lint/silent-warning-detector.mjs` had
        # been reporting 41 `catch-return-null` + 59 `empty-catch` since slice
        # A.2 while being referenced by NOTHING but `package.json#test:ci` — and
        # no workflow in this repo calls `test:ci`. A leg that is red on arrival
        # and wired to no executor can neither block a commit nor be seen, and
        # its count can grow in silence.
        #
        # It is now a ratchet leg: the two counts are ceiling lines in
        # `.peaks/lint/gate-baseline.json` (seeded from the detector by
        # `.husky/peaks-gate-baseline.mjs`, never typed in) and may only go DOWN.
        # `repo` mode below carries the same two rows through the same
        # comparison; this step is the same measurement on its own, so a breach
        # is attributed to the leg by NAME and in ~1s instead of surfacing at the
        # end of a minutes-long step. Deliberate overlap, not a second gate.
        #
        # FAIL-CLOSED: if the detector cannot run, or scans nothing, the gate
        # refuses (exit 1) rather than reporting a zero — the same posture as the
        # `REFUSING to measure` prettier branch and the `never linted` row.
        #
        # The detector's scope is its own `src/` walk (781 files measured
        # 2026-09-29), NOT the 1298-file `git ls-files` set the other legs use.
        # Recorded divergence; retargeting it is a different slice.
        run: node .husky/peaks-gate.mjs silent-warning

      - name: Whole-repo lint ratchet
        # Slice B5 (2026-09-23) moved the whole-repo ratchet OFF the push path
        # and INTO CI. The push gate now checks only the files being pushed: a
        # file you touch may not be worse than its own line in
        # `.peaks/lint/gate-baseline.json`, a file the diff adds must be clean,
        # a file the diff deletes contributes 0. Because the baseline stores a
        # number PER FILE, that per-file check ENTAILS the whole-repo total
        # check (Σ per-file baselines = 2878 = the `eslintFindings` ceiling,
        # measured on the 2026-09-22 baseline — an identity, not an estimate).
        #
        # The one thing the per-file check cannot see is growth on a file NOBODY
        # touched — config drift (a rule switched off/on, a phantom rule, a
        # coverage hole opening) rather than debt someone wrote. Rare, real, and
        # nobody's commit, so it is measured here instead of on a human's push.
        # This step is the whole reason the removal is safe; without it the
        # ratchet would simply have been deleted, which is not what happened.
        #
        # PLACEMENT IS LOAD-BEARING: `repo` mode's `tsc -p tsconfig.json` leg
        # resolves the shared `./version` subpath export into `packages/*/dist`,
        # which only the `Build` step above creates. This gate refuses to report
        # the resulting module-resolution errors as a type regression (it names
        # the cause instead), but on a fresh checkout the honest fix is to keep
        # it after `npm run build` — which is where it is.
        #
        # NO HISTORY NEEDED: this mode calls `git ls-files`, never `git diff`,
        # so it does not care about `origin/main`, remotes, or the depth-1
        # default checkout. It also contains NO tests — the `Test` step below
        # owns those — so the two coexist rather than overlap.
        #
        # It runs INSIDE the OS matrix deliberately: the ceiling is a single
        # number and it has to hold on every platform this repo supports, on the
        # same reasoning as the macOS cell above. A red on a non-Windows runner
        # is a finding about the product or the ceiling — triage it, and do not
        # drop this step or narrow the matrix to make it go away.
        run: node .husky/peaks-gate.mjs repo

      - name: Test
        # github-actions reporter surfaces each failure as a GitHub
        # annotation, which is readable without repo-admin rights — the
        # job log itself is admin-only on this repo.
        run: npx vitest run --reporter=default --reporter=github-actions
        env:
          # Suppress per-platform timing flake; tests stub Date where needed.
          TZ: UTC

      - name: Test workspace packages
        # Slice a5 (2026-09-29) — the package leg, scheduled. `pnpm -r
        # --filter "./packages/*" run test` is what runs each package's OWN
        # vitest config (shared 19, mut 22, shared-channel 20, internal-runtime
        # 113 cases measured 2026-09-29). Nothing in CI did that before: the
        # `Test` step above uses the ROOT config, whose `include` is
        # `tests/unit/**` and which collects ZERO paths under `packages/`
        # (`vitest list` measured), and `test:full` / `test:ci` — the only
        # scripts that reach the packages — are referenced by no workflow step.
        # So a published package could ship a red test, or an empty one, and CI
        # would never run it. That is the same shape the step above this one
        # exists to close for the silent-warning detector: a check that reports
        # nothing because nothing calls it.
        #
        # NOT `test:full`: it adds `--include-workspace-root`, i.e. it re-runs
        # the entire root suite the `Test` step just ran, and it drags in the
        # e2e / integration / lint configs each package-root script selects.
        # The filter is the point: package tests only, once.
        #
        # PLACEMENT: after `Build`, because `peaks-loop-shared/version` and its
        # siblings resolve into `packages/*/dist`, which only `Build` creates.
        # Inside the OS matrix on purpose — `fs.ts` / `paths.ts` behaviour
        # (path separators, directory walks) is exactly the class that differs by
        # platform, and this is where the Windows and macOS cells get that signal.
        # No `continue-on-error`, no `|| true`: a red here is a regression.
        run: pnpm -r --filter "./packages/*" run test
        env:
          TZ: UTC

      - name: Test e2e + documented-example suites
        # Diagnosis E1/E9, added 2026-09-15. `tests/e2e/**` (5 real CLI
        # critical-path tests) was excluded by BOTH vitest configs and
        # selected by NO script and NO CI step — it had never run. It is
        # selected here so "green" cannot again mean "checked nothing".
        # These tests drive the CLI IN-PROCESS (`runCli`), so no build is
        # needed and this step is cheap enough to sit in the main matrix.
        run: pnpm test:e2e

      - name: Lint README/doc contracts
        # Diagnosis E8, added 2026-09-15: `tests/lint/**` was collected by
        # the unit glob, so a README linter was reported as unit-test
        # coverage. It is its own suite now, and it runs.
        run: pnpm test:lint

      - name: Run capability guards
        # The J02/J* contracts spawn `bin/peaks.js`, whose caller-id
        # resolution falls through to D2/EX_USAGE (exit 64) on a CI runner
        # with no IDE adapter env. PEAKS_CALLER_ID is the documented
        # vendor-neutral override for exactly this case
        # (src/services/session/resolve-caller-id.ts L16-20).
        run: pnpm test:capability-guard
        env:
          PEAKS_CALLER_ID: ci-runner

  binding-store-multi-process:
    # Slice v2.18.0 REDO — two-Claude-windows CI integration test.
    # Exercises the binding-store P0 fix across 2 truly distinct child
    # Node processes; gated to ubuntu-latest because Windows / macOS
    # ACL / job-object semantics add non-determinism to the pid-suffix
    # surface. Adding this as a separate job keeps the main matrix
    # small (windows-latest x 2 node versions x 2 OSes = 4 cells).
    name: binding-store multi-process integration (ubuntu-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # pnpm/action-setup@v4 + @v6 both fail the self-installer on the
        # runner's default Node 24 (this step runs before setup-node pins
        # the matrix node). corepack is bundled with Node and needs no
        # external self-installer; pin pnpm to match packageManager.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Canonical typecheck happens inside `npm run build`: it builds every
        # workspace package (creating packages/*/dist, which the shared
        # `./version` subpath export resolves to) then runs
        # `tsc -p tsconfig.build.json`. A standalone pre-Build `tsc` step
        # cannot resolve `peaks-loop-shared/version` on a fresh checkout
        # (dist absent) and is therefore always red — removed (same contract
        # as publish.yml).
        run: npm run build

      - name: Test binding-store multi-process
        # The driver at scripts/fixtures/ci-binding-driver.mjs imports
        # the built dist/src/services/session/binding-store.js; the
        # `npm run build` step above populates `dist/`.
        run: PEAKS_FORCE_INTEGRATION=1 npx vitest run tests/integration/binding-store/multi-process.test.ts --reporter=default
        env:
          TZ: UTC
          CI: 'true'
          RUNNER_OS: Linux

  # Slice 2026-09-12 `integration-ci-and-windowshide`.
  #
  # Until now the FULL `tests/integration` suite (90 files / ~462 tests) ran
  # NOWHERE. The `test` job above runs the DEFAULT vitest config, whose
  # `include` is `tests/unit/**` and which EXCLUDES `tests/integration/**`;
  # the `binding-store-multi-process` job above covers exactly one file.
  # So "CI green" never covered this suite, and neither did any other signal.
  #
  # This job was first wired in as EXPECTED RED: it landed BEFORE the 20
  # known failures were fixed, and saying so out loud was the point. Those
  # failures have since been fixed — 2 product bugs, 1 triage finding
  # investigated and refused, the remaining stale expectations rewritten, and
  # 4 contract questions decided and implemented. The suite now passes on a
  # Windows developer machine (88 files / 2 skipped / 0 failed).
  #
  # SO THIS IS NO LONGER AN EXPECTED-RED JOB. A red here is now a real
  # regression and must be triaged as one, not waved through as the known
  # initial state. There is still deliberately NO `continue-on-error`, NO
  # `|| true`, NO skipped tests and NO relaxed assertions — suppressing a red
  # would recreate the exact "looks green, checked nothing" shape this job
  # exists to end.
  #
  # GREEN WAS MEASURED ON WINDOWS, AND THE FIRST UBUNTU RUN WAS RED — but the
  # causes were NOT platform-specific, which is worth knowing before this job
  # goes red again. All three failures were ENVIRONMENT-conditional: a runner
  # has no IDE adapter env and no developer $HOME, while a workstation has
  # both. Two of them reproduced on Windows once the environment was changed
  # rather than the OS, and one fails on Windows outright under a scrubbed env.
  # So the first question when this job goes red is "what does a runner have
  # that a workstation does not, or lack that it has" — not "which OS behaves
  # differently". Reaching for the platform explanation first would have sent
  # someone looking in the wrong subsystem for all three.
  # The classified triage that drove the fixes is in
  # `.peaks/_runtime/2026-09-12-session-e37ef0/qa/integration-triage-classified.md`.
  integration-suite:
    name: 'integration suite (tests/integration, ubuntu-only)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # Same reason as the jobs above: pnpm/action-setup's self-installer
        # fails on the runner's default Node 24.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Same contract as every other job here: `npm run build` creates
        # packages/*/dist (which the shared `./version` subpath export
        # resolves to) and runs the canonical typecheck. Parts of the
        # integration suite spawn `bin/peaks.js`, which needs `dist/`.
        run: npm run build

      - name: Test integration suite
        # Platform choice — ubuntu-latest ONLY. This is now an OPEN decision,
        # not a settled one, and the reason it used to be settled has expired.
        #
        # When this job was expected red, staying on one platform was right
        # for two stated reasons: the suite is serial (`fileParallelism:
        # false`, 60s timeouts, ~460 tests) so a second OS roughly doubles
        # wall-clock for a signal already known to be red; and Windows-specific
        # red (`spawn claude ENOENT`, plus two Windows-aware files:
        # release-precheck, vm-kvm-runtime) would have been mixed in with it.
        # Both reasons were explicitly deferred "to the slice that fixes the 20
        # failures" — and that slice has landed, so the deferral has run out.
        #
        # Windows is NOT added here. Doubling CI wall-clock is a cost decision
        # rather than a correctness one, the suite already passes on a Windows
        # developer machine, and adding a platform is exactly the kind of
        # change that should be made deliberately rather than as a rider on a
        # comment fix. Whoever wants the second data point should add it and
        # say so in the commit.
        #
        # `--config vitest.config.integration.ts` is explicit here, and this
        # step invokes `vitest` directly rather than `pnpm test:integration` —
        # so the repair of that script (rid 2026-09-13-leftover-cleanup item
        # 3.1: it omitted `--config`, inherited the base config's `include`,
        # and selected zero files) does NOT make this job run the suite twice.
        # The flag is now redundant rather than load-bearing; left in place so
        # this step keeps working against an older checkout.
        run: pnpm exec vitest run --config vitest.config.integration.ts tests/integration --reporter=default --reporter=github-actions
        env:
          TZ: UTC
          # Diagnosis E2, added 2026-09-15. 7 tests in this suite
          # (plan-cli.test.ts x6, ac8-empirical.test.ts x1) skip themselves
          # unless this is '1', and nothing anywhere set it — so they had
          # never executed. This job runs `npm run build` above, so the built
          # CLI they spawn genuinely exists: the precondition is satisfied
          # here and only here, so the switch is set here. Locally,
          # vitest.config.integration.ts derives the same value from whether
          # bin/peaks.js + dist/cli/program.js exist, so a built checkout
          # runs them and an unbuilt one skips them truthfully.
          PEAKS_BUILD_AVAILABLE: '1'
          # Same reason as the `test` job's capability-guard step (L61-69), and
          # the same env var: `tests/integration/capability-guard/**` is also
          # part of THIS suite, and the J* contracts spawn `bin/peaks.js`.
          # `request init` resolves a caller id and, with no IDE adapter env,
          # falls through to D2/EX_USAGE (exit 64) — a structured
          # `CALLER_ID_INVALID` envelope that the contract runner reads as a
          # spawn failure. PEAKS_CALLER_ID is the documented vendor-neutral
          # override for exactly this case.
          #
          # NOT a platform difference: this fails identically on a Windows
          # runner, and passes on a developer machine only because that shell
          # happens to carry the IDE's own caller-id variable
          # (CLAUDE_CODE_SESSION_ID). The `test` job above passes the same 15
          # contracts on BOTH OSes purely because it already sets this.
          PEAKS_CALLER_ID: ci-runner

  # Layer C of the read-only proof (rid-035, slice ①). AC-3 C is DEFINED as
  # "CI-only": the same layer-A/layer-B result has to hold with NO network and an
  # UNWRITABLE project tree, because layer B's in-process spy can only prove that
  # the APIs it knows about went uncalled (spec §5.3 records the same limitation).
  #
  # NO NETWORK comes from `unshare -n`: the step gets its own network namespace
  # with only loopback, so a process that reaches for the network fails instead of
  # quietly succeeding on a host that happens to have one.
  #
  # UNWRITABLE comes from POSIX mode bits - the fixture chmods the tree to
  # 0o555/0o444 when PEAKS_READONLY_SANDBOX=1 (`_proof-helpers.ts`) - and mode bits
  # DO NOT BIND ROOT, which ignores them through CAP_DAC_OVERRIDE. `unshare -n`
  # needs root (the runner user has no CAP_SYS_ADMIN), so the step drops back to
  # the runner's own uid/gid with `setpriv` BEFORE the tests start: the tree that
  # gets chmodded is then genuinely unwritable by the very process that probes it.
  # The uid is probed with `id -u`, never hardcoded - the runner's uid is not a
  # contract.
  #
  # It is deliberately NOT `unshare -r` (user-namespace root): root inside a fresh
  # user namespace is still root for the tree it is about to chmod, so that shape
  # would not make this half hold either. Only a real privilege drop is relied on,
  # and the two injection-control steps below are what demonstrate it.
  #
  # NO PACKAGE-MANAGER SHIM INSIDE THE SANDBOX. The tests run through the project's
  # own entry (`node node_modules/vitest/vitest.mjs`) - the same shape
  # `scripts/test-changed.mjs` uses. `pnpm` on a runner is a corepack shim that
  # resolves the pinned version through $HOME's cache and downloads it on a miss;
  # `sudo` sets HOME=/root, so inside the sandbox the shim found no cache and died
  # with `getaddrinfo EAI_AGAIN` before vitest ever started. HOME is passed through
  # explicitly for the same reason.
  #
  # The spec's FIRST arm refuses to trust any result unless it PROVES both
  # conditions by probing the environment, so a runner that cannot supply either one
  # goes red with a named cause rather than reporting a sandbox it was never in. The
  # two injection controls below keep that refusal honest: each removes ONE
  # condition and REQUIRES the matching half of the arm to go red, so an arm that
  # was relaxed, skipped, or satisfied by the flag itself fails this job instead of
  # quietly passing it.
  #
  # ubuntu-latest ONLY (`unshare`/`setpriv` are Linux facilities), and no
  # `continue-on-error`: a red here is a finding about the sandbox, not a flake to
  # suppress. The availability check is a separate step so "unshare/setpriv is
  # missing" is reported as itself rather than as a mysterious test failure.
  readonly-proof-sandbox:
    name: 'readonly proof layer C (no-network + unwritable, ubuntu-only)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # Same reason as every other job here: pnpm/action-setup's self-installer
        # fails on the runner's default Node 24.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # The proof spawns `bin/peaks.js`, which needs `dist/`.
        run: npm run build

      - name: Refuse when a sandbox tool is unavailable
        run: |
          for tool in unshare setpriv; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "$tool is not on this runner, so layer C cannot be measured."
              echo "That is a finding about the sandbox, not a reason to skip it."
              exit 1
            fi
          done

      # `setpriv` is what makes the unwritable half true rather than merely named:
      # it drops the root that `unshare` needed back to the runner's own uid/gid
      # before any test runs. See the job comment above for why root would defeat
      # the fixture's chmod. `sudo` is used ONLY to obtain CAP_SYS_ADMIN for the
      # network namespace; nothing below the drop runs with it.
      - name: Run the read-only proof with no network and a non-root, unwritable tree
        run: |
          sudo env "PATH=$PATH" HOME="$HOME" unshare -n \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            env \
              PEAKS_READONLY_SANDBOX=1 \
              PEAKS_CALLER_ID=ci-runner \
              TZ=UTC \
              node node_modules/vitest/vitest.mjs run --config vitest.config.integration.ts \
                tests/integration/readonly-surface/readonly-proof.test.ts \
                --reporter=default --reporter=github-actions

      # INJECTION CONTROL (AC-2), the NETWORK half. Exactly one token is removed
      # from the step above - the `unshare -n` that creates the network namespace -
      # and the precondition arm's network half MUST go red. RED IS THE PASS here:
      # an arm that was relaxed, or that trusted PEAKS_READONLY_SANDBOX instead of
      # probing, would stay green and fail this step. `-t` narrows the run to the
      # precondition arm. `!cancelled()` keeps this evidence in the log even when
      # the step above went red - that is when it is most needed.
      - name: Control - without the network namespace the network half must go red
        if: ${{ !cancelled() }}
        run: |
          set +e
          output=$(sudo env "PATH=$PATH" HOME="$HOME" \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            env PEAKS_READONLY_SANDBOX=1 PEAKS_CALLER_ID=ci-runner TZ=UTC \
            node node_modules/vitest/vitest.mjs run --config vitest.config.integration.ts \
              tests/integration/readonly-surface/readonly-proof.test.ts \
              -t 'should prove the claim before trusting any result' 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "CONTROL FAILED: the arm stayed green with a reachable network, so"
            echo "its network half is not really evaluated."
            exit 1
          fi
          if ! grep -qF 'network is reachable: this is not a no-network sandbox' <<<"$output"; then
            echo "CONTROL FAILED: the arm went red, but not on the network half."
            exit 1
          fi
          echo "CONTROL OK: with the network namespace removed, the network half went red."

      # INJECTION CONTROL (AC-2), the UNWRITABLE half. Here `unshare -n` stays and
      # only the privilege drop is removed, so the process is root again - the shape
      # this job had before the fix. The fixture still chmods the tree, but root
      # ignores mode bits, so the probe's write SUCCEEDS and the arm must go red.
      # The middle guard attributes that red to the second half: it refuses a run
      # that died on the network half first, which would prove nothing about this
      # one. Both halves of the arm are therefore exercised by an observed run,
      # never by an argument about the code.
      - name: Control - as root the unwritable half must go red
        if: ${{ !cancelled() }}
        run: |
          set +e
          output=$(sudo env "PATH=$PATH" HOME="$HOME" unshare -n \
            env PEAKS_READONLY_SANDBOX=1 PEAKS_CALLER_ID=ci-runner TZ=UTC \
            node node_modules/vitest/vitest.mjs run --config vitest.config.integration.ts \
              tests/integration/readonly-surface/readonly-proof.test.ts \
              -t 'should prove the claim before trusting any result' 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "CONTROL FAILED: the arm stayed green as root, so the unwritable half"
            echo "is not really evaluated (or the fixture no longer chmods the tree)."
            exit 1
          fi
          if grep -qF 'network is reachable' <<<"$output"; then
            echo "CONTROL FAILED: the network half failed first, so this red proves"
            echo "nothing about the unwritable half."
            exit 1
          fi
          if ! grep -qF 'should prove the claim before trusting any result' <<<"$output"; then
            echo "CONTROL FAILED: the red was not the precondition arm."
            exit 1
          fi
          echo "CONTROL OK: as root the unwritable half went red - which is exactly why"
          echo "the real step drops privileges."

  # S10 (2026-09-15): the `Co-Authored-By` red rule in `CLAUDE.md` — "effective
  # 2026-07-01, no exceptions" — had no executor at all until this job: no
  # husky / lefthook / commitlint, and `.git/hooks/` holds only `.sample`
  # files. The guard is `tests/unit/standards/no-ai-co-author-trailer.test.ts`,
  # which the `test` job above also runs.
  #
  # WHY THIS JOB EXISTS ANYWAY, given the test job already runs the file.
  # `actions/checkout@v4` defaults to `fetch-depth: 1`, so in the `test` job
  # the guard reads the TIP COMMIT ONLY. For a direct push to `main` that is
  # exactly the pushed commit, so the check is real there — but a multi-commit
  # push would leave every commit but the tip unchecked, and "reads one commit"
  # and "reads 1876 commits" are not the same claim. This job checks out the
  # full history so the whole-history claim is ENFORCED on a runner rather
  # than asserted in a comment.
  #
  # ubuntu-latest ONLY: this is a property of commit messages, with no
  # platform dimension in it, so a matrix would buy nothing and cost a
  # full-history fetch three times. No `continue-on-error`, no `|| true`: a
  # red here means a commit in this repository's history carries AI-assistant
  # attribution, and the remedy is to rewrite it before it spreads.
  #
  # The guard has its own injection control (it builds a throwaway repo, commits
  # a violating message into it, and asserts it goes red), so it cannot pass by
  # being unable to fail.
  commit-message-red-line:
    name: 'commit-message red line (no AI co-author trailer, full history)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole point of the job. See above.
          fetch-depth: 0

      - name: Setup pnpm (corepack)
        # Same reason as every other job here: pnpm/action-setup's
        # self-installer fails on the runner's default Node 24.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the red-line guard
        # No `npm run build`: the guard imports nothing from `dist/` and spawns
        # no CLI — it reads `git log` and matches strings.
        run: pnpm exec vitest run tests/unit/standards/no-ai-co-author-trailer.test.ts --reporter=default --reporter=github-actions
        env:
          TZ: UTC
          PEAKS_CALLER_ID: ci-runner

  # W2/D2 (rid-038). THE WIDE FORMATTING CHECK HAD NO EXECUTOR, AND THAT IS HOW
  # UNFORMATTED FILES REACHED A COMMIT.
  #
  # WHAT WAS MEASURED 2026-10-09. `pnpm format:check` covers `src`, `tests`,
  # `packages` and `scripts`. The pre-commit gate compares only the owner-decided
  # lint scope — `src/**` + `packages/*/src/**` (`.husky/lint-scope.mjs`, owner
  # decision 2026-10-03) — and NAMES the difference out loud ("N staged file(s)
  # are outside the lint scope and were not compared"), so a staged `tests/**` or
  # `scripts/**` file was never formatted-checked on the way in. Nothing in CI ran
  # `format:check` either. So the wider check existed as a script that no executor
  # called, and a batch of unformatted files went to a commit with every gate green.
  #
  # ARE THE TWO SCOPES MEANT TO BE IDENTICAL? NO — deliberately not, and this is the
  # answer nobody had written down:
  #   * the pre-commit gate is a PER-FILE RATCHET ("a file you touch may not be worse
  #     than its own baseline row"). It needs a baseline row per file, so its scope is
  #     the owned product boundary, not "every file with a code extension".
  #   * this job is a SET RATCHET over the same four trees: no per-file row, one
  #     allowed SET of known names, and it may only shrink. It answers "did an
  #     unformatted file appear OUTSIDE that set" — a ratchet, one level up from
  #     the per-file one.
  # Aligning them either way is worse than the divergence:
  #   (a) widening the ratchet to `tests/**` + `scripts/**` re-opens an owner decision,
  #       needs baseline rows for ~600 more files, and would immediately refuse every
  #       commit touching one of the 12 files below — under `.husky/gate/ratchet.mjs`
  #       an absent row reads as NEW FILE and a new file must be clean outright;
  #   (b) narrowing `format:check` to the lint scope would delete formatting coverage
  #       exactly where the leak happened.
  # So the SCOPES STAY DIFFERENT and the missing half was the WIDE EXECUTOR. This job
  # is it, and it is a RATCHET like the pre-commit gate: the two scopes differ in WHAT
  # they cover and in nothing else — both ratchet, neither is a whole-repo boolean. They
  # can therefore never drift into "a check that is documented and never run" again.
  #
  # GREEN ON ARRIVAL, AND THAT IS THE POINT — A SET RATCHET, NOT A BOOLEAN. 12 files
  # are unformatted today and were unformatted before this job existed. The job asserts
  # the current unformatted set stays INSIDE the baseline SET of 12 known names, so it is
  # GREEN on the tree it lands on and RED the moment an unformatted file appears OUTSIDE
  # that set — the only way the leak recurs, and the thing a boolean could never say (a
  # boolean over 12 pre-existing violations is red forever, and a job that is red forever
  # is a job everyone learns to ignore — the pass-shaped anti-pattern W2 exists to remove,
  # not a stronger gate). The 12 names live in ONE named place WITH their rationale:
  # `FORMAT_CHECK_BASELINE_FILES` at the top of `.husky/format-check-ratchet.mjs`. They are
  # PRE-EXISTING debt this job SURFACES; it does not create it and this slice does not fix
  # it, and the set may only SHRINK. NO `continue-on-error`, NO `|| true`: a step that
  # cannot fail is the defect this job exists to end.
  #
  # WHY THE JOB NAME CARRIES NO NUMBER (rid-038 repair 2). The old name said
  # `unformatted <= 12`. That `12` was a SECOND spelling of the baseline, in a file nothing
  # observes: lowering the set later would have left the name claiming a stale bound,
  # silently — the §2.28 shape, wearing a number instead of a scope. A set has no single
  # number to derive a name from, so the name states the RULE instead ("baseline
  # containment") and the count is only ever `FORMAT_CHECK_BASELINE_FILES.length`.
  #
  # ubuntu-latest ONLY. Formatting is platform-independent, and a Windows runner whose
  # git applies `core.autocrlf` reads an LF file as CRLF and flags ALL of them — a red
  # about the checkout rather than the tree. This repo already neutralizes exactly that
  # in its own fixtures (`-c core.autocrlf=false`, `tests/unit/lint/_file-size-hooks-fixture.ts`),
  # so a second and third copy of this step would buy a line-ending risk, not a signal.
  format-check:
    name: 'format set ratchet (baseline containment; src, tests, packages, scripts)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        # Same reason as every other job here: pnpm/action-setup's self-installer
        # fails on the runner's default Node 24.
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --version

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (set ratchet)
        # The developer's own SCOPE, ratcheted instead of booleaned: the ratchet reads
        # the four globs from `package.json#scripts['format:check']` (there is no
        # copied glob list here) and runs prettier in `--list-different` form. The
        # baseline SET of names and its rationale live in exactly one place — the
        # exported `FORMAT_CHECK_BASELINE_FILES` at the top of
        # `.husky/format-check-ratchet.mjs` — so neither the scope nor the number is
        # spelled twice here and left to drift (§2.28).
        run: node .husky/format-check-ratchet.mjs
