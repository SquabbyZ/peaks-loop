<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Layout align fixture — mismatched parents</title>
    <style>
      /* The two parents declare different spacing tokens (16px vs 24px) while
         both headings have identical font, colour and padding. This is the
         failure mode the PRD reproduced: the visual left edges differ. */
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #111;
      }
      .section {
        padding: 24px;
      }
      .tight {
        padding-left: 16px; /* space.section */
      }
      .roomy {
        padding-left: 24px; /* space.roomy */
      }
      h2 {
        font-size: 18px;
        line-height: 1.4;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="section tight"><h2>Quarterly report</h2></div>
    <div class="section roomy"><h2>Quarterly review</h2></div>
  </body>
</html>
