        <text x="14" y="46" font-size="22" font-weight="700" fill="#e6edf3">19<tspan font-size="13" fill="#7d8590">/19</tspan></text>
        <text x="14" y="68" font-size="12" fill="#7ee787">✓ all sub-agents returned</text>
        <text x="14" y="86" font-size="11" fill="#7d8590">wave 3/3 · barrier ok</text>
