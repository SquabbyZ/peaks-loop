<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="peaks-loop 4.0.1 — Loop Engineering, Engineered">
  <title>peaks-loop 4.0.1 — Loop Engineering, Engineered</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#f78166"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2128"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="14"/>
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#30363d" stroke-width="1.5" rx="10"/>

  <!-- terminal prompt motif: peaks > -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="60" y="82" font-size="22" fill="#7d8590">$</text>
    <text x="92" y="82" font-size="22" fill="#58a6ff">peaks</text>
    <text x="172" y="82" font-size="22" fill="#e6edf3">code</text>
    <text x="238" y="82" font-size="22" fill="#7d8590">run</text>
    <text x="290" y="82" font-size="22" fill="#7d8590">"</text>
    <text x="312" y="82" font-size="22" fill="#f78166">build this feature</text>
    <text x="528" y="82" font-size="22" fill="#7d8590">"</text>
    <text x="548" y="82" font-size="22" fill="#7d8590">&gt;</text>
    <rect x="568" y="64" width="14" height="22" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- version + status row -->
  <g transform="translate(60, 116)">
    <rect width="240" height="40" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="120" y="27" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#e6edf3" font-weight="600">v4.0.1  ·  GA</text>
  </g>
  <g transform="translate(312, 116)">
    <rect width="220" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="110" y="27" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#7d8590">5 domains · 14 skills</text>
  </g>
  <g transform="translate(544, 116)">
    <rect width="180" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="90" y="27" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#7d8590">285+ tests · 4 pkgs</text>
  </g>

  <!-- headline -->
  <text x="60" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">Loop Engineering,</text>
  <text x="60" y="306" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#e6edf3">Engineered.</tspan>
    <tspan fill="#7d8590" font-size="32" font-weight="500" dx="16">v4.0.1</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="354" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#8b949e">你说话,它替你跑完一整条工程流水线 —— 不止写代码,跑两次就沉淀成本地战术。</text>

  <!-- 5 skill chips -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">
    <g transform="translate(60, 378)">
      <rect width="170" height="32" rx="16" fill="url(#chip)" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="85" y="21" text-anchor="middle" fill="#58a6ff">/peaks-code</text>
    </g>
    <g transform="translate(240, 378)">
      <rect width="200" height="32" rx="16" fill="url(#chip)" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#58a6ff">/peaks-content</text>
    </g>
    <g transform="translate(450, 378)">
      <rect width="180" height="32" rx="16" fill="url(#chip)" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="90" y="21" text-anchor="middle" fill="#58a6ff">/peaks-doctor</text>
    </g>
    <g transform="translate(640, 378)">
      <rect width="240" height="32" rx="16" fill="url(#chip)" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="120" y="21" text-anchor="middle" fill="#58a6ff">/peaks-issue-fix-orch</text>
    </g>
    <g transform="translate(890, 378)">
      <rect width="150" height="32" rx="16" fill="url(#chip)" stroke="#f78166" stroke-width="1.5"/>
      <text x="75" y="21" text-anchor="middle" fill="#f78166">/peaks-sop</text>
    </g>
  </g>
</svg>