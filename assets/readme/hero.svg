          <rect x="44"  y="0" width="38" height="14" rx="2" fill="#00d4ff" opacity="0.55"/>
          <rect x="88"  y="0" width="38" height="14" rx="2" fill="#00d4ff" opacity="0.95"/>
          <rect x="132" y="0" width="38" height="14" rx="2" fill="#a371f7" opacity="0.75"/>
          <rect x="176" y="0" width="38" height="14" rx="2" fill="#7ee787" opacity="0.85"/>
          <rect x="220" y="0" width="38" height="14" rx="2" fill="#7ee787" opacity="0.95"/>
        </g>
      </g>
      <!-- pane 4: clock + sparkline -->
