        <text x="14" y="22" font-size="11" fill="#7d8590">▣ GIT</text>
        <text x="14" y="46" font-size="14" font-weight="700" fill="#e6edf3">main · <tspan fill="#7ee787">+3</tspan> <tspan fill="#ff7b72">-1</tspan></text>
        <text x="14" y="68" font-size="11" fill="#7d8590">2h ago · SquabbyZ</text>
