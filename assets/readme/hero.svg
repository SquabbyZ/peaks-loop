      <text x="0" y="106"><tspan fill="#7ee787">[gate]</tspan> unit · 161/161 · 4.1s</text>
      <text x="0" y="126"><tspan fill="#7ee787">[gate]</tspan> integration · 12/12 · 1.3s</text>
      <text x="0" y="146"><tspan fill="#7ee787">[gate]</tspan> code-audit · 0 violation · 0.8s</text>
      <text x="0" y="166"><tspan fill="#7ee787">[gate]</tspan> security-scan · 0 finding · 0.5s</text>
      <text x="0" y="186"><tspan fill="#7ee787">[gate]</tspan> qa-review · verdict=PASS · cost-ratio=3.4 · 4-dim=ok · 6.2s</text>
      <text x="0" y="206"><tspan fill="#7ee787">[gate]</tspan> review-signoff · <tspan fill="#7ee787">✓</tspan> passed</text>
      <text x="0" y="226"><tspan fill="#a371f7">[eval]</tspan> darwin-skore <tspan fill="#7ee787">+0.83</tspan> · skeptic-2 <tspan fill="#7ee787">RETAIN</tspan> · 1.9s</text>
      <text x="0" y="246"><tspan fill="#ff7b72">[ui]</tspan> ready for handoff — 7/7 gates green · total wall 16.3s</text>
    </g>

