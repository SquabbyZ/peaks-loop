        <text x="14" y="22" font-size="11" fill="#7d8590">▣ GATE</text>
        <text x="14" y="46" font-size="22" font-weight="700" fill="#e6edf3">6<tspan font-size="13" fill="#7d8590">/6</tspan></text>
        <text x="14" y="68" font-size="12" fill="#7ee787">✓ all green</text>
        <!-- mini progress bar 6/6 -->
        <g transform="translate(14, 76)">
