      <text x="0" y="26"><tspan fill="#a371f7">[trace]</tspan> session=2026-07-30-602e5c · change-id=004-c8 · mode=full-auto</text>
      <text x="0" y="46"><tspan fill="#a371f7">[trace]</tspan> routing → <tspan fill="#00d4ff">peaks-code</tspan> (code-domain)</text>
