    <text x="20" y="0" font-size="15" fill="#00d4ff">peaks</text>
    <text x="78" y="0" font-size="15" fill="#e6edf3">code</text>
    <text x="124" y="0" font-size="15" fill="#7d8590">run</text>
    <text x="160" y="0" font-size="15" fill="#a371f7">"build this feature"</text>
    <text x="332" y="0" font-size="15" fill="#7d8590">--24h</text>
    <text x="384" y="0" font-size="15" fill="#7d8590">&gt;</text>
    <rect x="402" y="-14" width="9" height="18" fill="#7ee787" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0;1" dur="1.06s" repeatCount="indefinite"/>
