  </g>

  <!-- bottom marquee -->
  <g transform="translate(0, 502)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">
    <rect x="14" y="-2" width="1172" height="22" fill="#161b22" rx="0"/>
    <text x="32" y="14" fill="#7d8590">$ peaks <tspan fill="#7ee787">●</tspan> ready · next: peaks slice check --auto · 4 packages · 285+ cases · MIT · Node ≥ 20</text>
