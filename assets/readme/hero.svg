        <text x="14" y="22" font-size="11" fill="#7d8590">▣ CLOCK</text>
        <text x="14" y="46" font-size="22" font-weight="700" fill="#e6edf3">16.3<tspan font-size="13" fill="#7d8590">s</tspan></text>
        <text x="14" y="68" font-size="11" fill="#7d8590">wall · v4.0.1 GA</text>
