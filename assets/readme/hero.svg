    <rect x="14" y="40" width="1172" height="10" fill="#161b22"/>
    <circle cx="40" cy="32" r="6" fill="#ff5f57"/>
    <circle cx="62" cy="32" r="6" fill="#febc2e"/>
    <circle cx="84" cy="32" r="6" fill="#28c840"/>
