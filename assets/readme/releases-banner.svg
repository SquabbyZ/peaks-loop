<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="peaks-loop 4.0.0 GA release banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#f78166"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" rx="14"/>
  <rect x="20" y="20" width="1160" height="320" fill="none" stroke="#30363d" stroke-width="1.5" rx="10"/>

  <!-- terminal prompt motif: peaks-code > -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="92" font-size="22" fill="#7d8590">$</text>
    <text x="92" y="92" font-size="22" fill="#58a6ff">peaks</text>
    <text x="160" y="92" font-size="22" fill="#e6edf3">code</text>
    <text x="226" y="92" font-size="22" fill="#7d8590">&gt;</text>
    <text x="260" y="92" font-size="22" fill="#f78166">release</text>
    <text x="350" y="92" font-size="22" fill="#7d8590">--</text>
    <text x="392" y="92" font-size="22" fill="#58a6ff">4.0.0</text>
  </g>

  <!-- version badge -->
  <g transform="translate(60, 130)">
    <rect width="220" height="40" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="110" y="27" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#e6edf3" font-weight="600">v4.0.0  ·  GA</text>
  </g>

  <!-- headline -->
  <text x="60" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">First stable cutover from 4.0.0-beta.36</text>

  <!-- sub -->
  <text x="60" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#7d8590">219 cases · 4 packages · 67s full-suite · auto-compact visible</text>

  <!-- 4 epic chips -->
  <g font-family="ui-monospace, monospace" font-size="16">
    <g transform="translate(60, 290)">
      <rect width="250" height="36" rx="18" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="125" y="23" text-anchor="middle" fill="#58a6ff">test-rebuild</text>
    </g>
    <g transform="translate(322, 290)">
      <rect width="280" height="36" rx="18" fill="#0d1117" stroke="#f78166" stroke-width="1.5"/>
      <text x="140" y="23" text-anchor="middle" fill="#f78166">karpathy-cost</text>
    </g>
    <g transform="translate(614, 290)">
      <rect width="246" height="36" rx="18" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="123" y="23" text-anchor="middle" fill="#58a6ff">compact-visibility</text>
    </g>
    <g transform="translate(872, 290)">
      <rect width="268" height="36" rx="18" fill="#0d1117" stroke="#f78166" stroke-width="1.5"/>
      <text x="134" y="23" text-anchor="middle" fill="#f78166">workspace test:full</text>
    </g>
  </g>
</svg>
