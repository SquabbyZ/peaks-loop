<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-label="peaks-loop 4.x ship summary — 19 rids timeline with category chips">
  <title>peaks-loop 4.x ship summary — 19 rids timeline with category chips</title>
  <defs>
    <linearGradient id="shb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="shcy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="shpp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#ff7b72"/>
    </linearGradient>
    <filter id="shglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#shb)" rx="14"/>
  <rect x="10" y="10" width="1180" height="460" fill="none" stroke="#1f2937" stroke-width="1" rx="10"/>

  <text x="36" y="40" font-family="ui-monospace, monospace" font-size="12" fill="#7d8590">$ peaks ship log --version 4.x --format=timeline</text>
  <text x="36" y="74" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Ship 摘要</text>
  <text x="172" y="74" font-family="ui-monospace, monospace" font-size="12" fill="#7d8590">— 4.x · <tspan fill="#7ee787">19 rids</tspan> · 2026-06 → 2026-07</text>
  <text x="1124" y="72" font-family="ui-monospace, monospace" font-size="11" fill="#7d8590" text-anchor="end">v4.0.3 GA · 4 packages</text>

