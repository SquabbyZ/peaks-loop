<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" role="img" aria-label="peaks-loop 5 first-class domains — code, content, doctor, issue-fix, sop">
  <title>peaks-loop 5 first-class domains — code, content, doctor, issue-fix, sop</title>
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="540" fill="url(#dbg)" rx="14"/>
  <rect x="20" y="20" width="1160" height="500" fill="none" stroke="#30363d" stroke-width="1.5" rx="10"/>

  <text x="60" y="64" font-family="ui-monospace, monospace" font-size="14" fill="#7d8590">$ peaks skill list --domain</text>
  <text x="60" y="106" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">一条斜杠命令 · 五条域</text>
  <text x="60" y="138" font-family="system-ui, sans-serif" font-size="16" fill="#8b949e">每个域自带编排器,每条命令自带闸门 —— 坏了就停,中间不扔半截。</text>

  <!-- 5 domain cards (top row 3 + bottom row 2) -->
  <g font-family="system-ui, sans-serif">
    <!-- code -->
    <g transform="translate(60, 174)">
      <rect width="350" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="20" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">💻 /peaks-code</text>
      <text x="20" y="68" font-size="20" font-weight="700" fill="#e6edf3">code-domain 编排器</text>
      <text x="20" y="96" font-size="13" fill="#8b949e">PRD → RD → 实现 → QA → UI → 切片</text>
      <text x="20" y="118" font-size="13" fill="#8b949e">跑完交你拍板 · 唯一 code-only 域</text>
      <text x="20" y="138" font-family="ui-monospace, monospace" font-size="12" fill="#58a6ff">→ end-to-end, gated, hand-off</text>
    </g>
    <!-- content -->
    <g transform="translate(425, 174)">
      <rect width="350" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="20" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">📝 /peaks-content</text>
      <text x="20" y="68" font-size="20" font-weight="700" fill="#e6edf3">content 编排器</text>
      <text x="20" y="96" font-size="13" fill="#8b949e">草稿 → 编辑 → 调性 → 发布 → 归档</text>
      <text x="20" y="118" font-size="13" fill="#8b949e">中间不跳步 · 不替你拍调性</text>
      <text x="20" y="138" font-family="ui-monospace, monospace" font-size="12" fill="#58a6ff">→ draft to ship, no skipped stage</text>
    </g>
    <!-- doctor -->
    <g transform="translate(790, 174)">
      <rect width="350" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="20" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">🩺 /peaks-doctor</text>
      <text x="20" y="68" font-size="20" font-weight="700" fill="#e6edf3">doctor 编排器</text>
      <text x="20" y="96" font-size="13" fill="#8b949e">红线审计 + L3 doctor + 转 OpenSpec</text>
      <text x="20" y="118" font-size="13" fill="#8b949e">坏在哪道停在哪道 · 转可执行变更</text>
      <text x="20" y="138" font-family="ui-monospace, monospace" font-size="12" fill="#58a6ff">→ audit → doctor → openspec</text>
    </g>
    <!-- issue-fix-orch -->
    <g transform="translate(60, 344)">
      <rect width="540" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="20" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">🐛 /peaks-issue-fix-orchestrator</text>
      <text x="20" y="68" font-size="20" font-weight="700" fill="#e6edf3">批量修 issue 编排器</text>
      <text x="20" y="96" font-size="13" fill="#8b949e">调研 → 分类 → 参考 PR → 逐个修复 + commit + PR 草稿</text>
      <text x="20" y="118" font-size="13" fill="#8b949e">30 个 open issue 一次清,每个 PR 都可单独合</text>
      <text x="20" y="138" font-family="ui-monospace, monospace" font-size="12" fill="#58a6ff">→ sweep, classify, fix, draft PR</text>
    </g>
    <!-- sop -->
    <g transform="translate(615, 344)">
      <rect width="525" height="150" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
      <text x="20" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#f78166">📋 /peaks-sop</text>
      <text x="20" y="68" font-size="20" font-weight="700" fill="#e6edf3">自定义 SOP 编排器</text>
      <text x="20" y="96" font-size="13" fill="#8b949e">自然语言描述 → 自动生成 + 校验 + 注册成可执行 SOP</text>
      <text x="20" y="118" font-size="13" fill="#8b949e">门禁在阶段间,不要 CLI / 不要 manifest</text>
      <text x="20" y="138" font-family="ui-monospace, monospace" font-size="12" fill="#f78166">→ NL → gated workflow</text>
    </g>
  </g>

  <!-- bottom: solo / resume / status / test primitives -->
  <text x="60" y="514" font-family="ui-monospace, monospace" font-size="14" fill="#7d8590">$ peaks skill list --primitive    # 通用原语:peaks-solo 分诊 · peaks-resume 续 · peaks-status 看 · peaks-test 测 · peaks-slice-decompose 切片</text>
</svg>