<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="peaks-loop live pulse — 4 metric tiles with radial ring + data flow + commit heatmap">
  <title>peaks-loop live pulse — 4 metric tiles with radial ring + data flow + commit heatmap</title>
  <defs>
    <linearGradient id="pb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pcyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="ppp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#ff7b72"/>
    </linearGradient>
    <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#pb)" rx="14"/>
  <rect x="10" y="10" width="1180" height="340" fill="none" stroke="#1f2937" stroke-width="1" rx="10"/>

  <text x="36" y="40" font-family="ui-monospace, monospace" font-size="12" fill="#7d8590">$ peaks status --live --format radial</text>
  <text x="36" y="74" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">pulse</text>
  <text x="120" y="74" font-family="system-ui, sans-serif" font-size="22" font-weight="300" fill="#7d8590">— v4.0.1 GA · 4 packages</text>
  <circle cx="1140" cy="68" r="4" fill="#7ee787" filter="url(#pglow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.0s" repeatCount="indefinite"/>
  </circle>
  <text x="1124" y="72" font-family="ui-monospace, monospace" font-size="11" fill="#7d8590" text-anchor="end">● live</text>

  <!-- 4 tiles with radial ring + flow lines -->
  <g transform="translate(36, 110)">
    <!-- tile 1: cases with ring -->
    <g>
      <rect width="270" height="120" fill="#0a0e14" stroke="#1f2937" stroke-width="1" rx="8"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590">▣ CASES</text>
      <text x="200" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#7d8590" text-anchor="end">4 pkgs</text>
      <!-- ring -->
      <g transform="translate(135, 76)">
        <circle r="32" fill="none" stroke="#1f2937" stroke-width="4"/>
        <circle r="32" fill="none" stroke="url(#pcyan)" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="180 201" transform="rotate(-90)" filter="url(#pglow)"/>
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" y="6">285</text>
      </g>
      <text x="14" y="106" font-family="ui-monospace, monospace" font-size="10" fill="#7ee787">▲ 161 → 285+</text>
    </g>
    <!-- tile 2: wall -->
    <g transform="translate(280, 0)">
      <rect width="270" height="120" fill="#0a0e14" stroke="#1f2937" stroke-width="1" rx="8"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590">▣ WALL</text>
      <text x="200" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#7d8590" text-anchor="end">pnpm test:full</text>
      <g transform="translate(135, 76)">
        <circle r="32" fill="none" stroke="#1f2937" stroke-width="4"/>
        <circle r="32" fill="none" stroke="url(#pcyan)" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="201 201" transform="rotate(-90)" filter="url(#pglow)"/>
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" y="6">80s</text>
      </g>
      <text x="14" y="106" font-family="ui-monospace, monospace" font-size="10" fill="#7ee787">▼ 3h+ → 80s</text>
    </g>
    <!-- tile 3: rids -->
    <g transform="translate(560, 0)">
      <rect width="270" height="120" fill="#0a0e14" stroke="#1f2937" stroke-width="1" rx="8"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590">▣ SHIPPED</text>
      <text x="200" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#7d8590" text-anchor="end">4.x</text>
      <g transform="translate(135, 76)">
        <circle r="32" fill="none" stroke="#1f2937" stroke-width="4"/>
        <circle r="32" fill="none" stroke="url(#ppp)" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="201 201" transform="rotate(-90)" filter="url(#pglow)"/>
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" y="6">19</text>
      </g>
      <text x="14" y="106" font-family="ui-monospace, monospace" font-size="10" fill="#7ee787">▲ 009 → 034</text>
    </g>
    <!-- tile 4: cli -->
    <g transform="translate(840, 0)">
      <rect width="288" height="120" fill="#0a0e14" stroke="#1f2937" stroke-width="1" rx="8"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590">▣ CLI</text>
      <text x="200" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#7d8590" text-anchor="end">byte-identical</text>
      <g transform="translate(135, 76)">
        <circle r="32" fill="none" stroke="#1f2937" stroke-width="4"/>
        <circle r="32" fill="none" stroke="url(#ppp)" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="14 201" transform="rotate(-90)" filter="url(#pglow)"/>
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" y="6">5</text>
      </g>
      <text x="14" y="106" font-family="ui-monospace, monospace" font-size="10" fill="#7ee787">▼ 73 → 5 super</text>
    </g>
  </g>

  <!-- data flow lines between tiles -->
  <g transform="translate(36, 220)" stroke="#30363d" stroke-width="1" fill="none">
    <line x1="270" y1="0" x2="280" y2="0"/>
    <line x1="550" y1="0" x2="560" y2="0"/>
    <line x1="830" y1="0" x2="840" y2="0"/>
  </g>
  <g transform="translate(36, 220)">
    <circle cx="275" cy="0" r="3" fill="#00d4ff" filter="url(#pglow)">
      <animate attributeName="cx" values="270;280;270" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="0" r="3" fill="#a371f7" filter="url(#pglow)">
      <animate attributeName="cx" values="550;560;550" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="835" cy="0" r="3" fill="#7ee787" filter="url(#pglow)">
      <animate attributeName="cx" values="830;840;830" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bottom: 7-gate progress + commit heatmap -->
  <g transform="translate(36, 250)" font-family="ui-monospace, monospace" font-size="11">
    <text x="0" y="0" fill="#7d8590">▣ pipeline  <tspan fill="#7ee787">●</tspan> unit  <tspan fill="#7ee787">●</tspan> integ  <tspan fill="#7ee787">●</tspan> audit  <tspan fill="#7ee787">●</tspan> sec  <tspan fill="#7ee787">●</tspan> qa  <tspan fill="#7ee787">●</tspan> review  <tspan fill="#7ee787">●</tspan> eval</text>
    <rect x="0" y="14" width="1128" height="10" rx="5" fill="#1f2937"/>
    <rect x="0" y="14" width="1128" height="10" rx="5" fill="url(#pcyan)" filter="url(#pglow)"/>
    <text x="0" y="46" fill="#7d8590">▣ commits (12w)</text>
    <g transform="translate(110, 30)">
      <rect x="0"   y="6"  width="74" height="14" rx="2" fill="#00d4ff" opacity="0.30"/>
      <rect x="80"  y="0"  width="74" height="20" rx="2" fill="#00d4ff" opacity="0.50"/>
      <rect x="160" y="3"  width="74" height="17" rx="2" fill="#00d4ff" opacity="0.65"/>
      <rect x="240" y="0"  width="74" height="20" rx="2" fill="#00d4ff" opacity="0.80"/>
      <rect x="320" y="6"  width="74" height="14" rx="2" fill="#a371f7" opacity="0.55"/>
      <rect x="400" y="0"  width="74" height="20" rx="2" fill="#a371f7" opacity="0.85"/>
      <rect x="480" y="3"  width="74" height="17" rx="2" fill="#a371f7" opacity="0.65"/>
      <rect x="560" y="6"  width="74" height="14" rx="2" fill="#00d4ff" opacity="0.70"/>
      <rect x="640" y="0"  width="74" height="20" rx="2" fill="#00d4ff" opacity="0.90"/>
      <rect x="720" y="0"  width="74" height="20" rx="2" fill="#00d4ff" opacity="0.95"/>
      <rect x="800" y="3"  width="74" height="17" rx="2" fill="#7ee787" opacity="0.85"/>
      <rect x="880" y="0"  width="74" height="20" rx="2" fill="#7ee787" opacity="0.95"/>
      <rect x="960" y="0"  width="74" height="20" rx="2" fill="#7ee787" opacity="0.95"/>
      <text x="1040" y="14" font-size="9" fill="#7d8590">12w</text>
    </g>
  </g>
</svg>